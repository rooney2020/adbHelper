<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skill 查看器</title>
    <link rel="stylesheet" href="./assets/style.css" />
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <div hidden>
        <strong id="rootDirectoryLabel">未选择</strong>
        <strong id="currentFileLabel">未打开</strong>
        <strong id="referenceCountLabel">0 条</strong>
      </div>

      <section id="viewerShell" hidden>
        <header class="hero">
          <div class="hero-title-block">
            <h1>Skill 查看器</h1>
          </div>
          <div id="rootDirectoryBanner" class="hero-path">当前未选择 skill 目录</div>
          <div class="hero-card compact-card">
            <div class="hero-actions">
              <button id="backToEntryBtn" class="ghost-button" type="button">清空当前选择</button>
              <button id="pickDirectoryBtn" class="primary-button" type="button">选择目录</button>
              <button id="openFallbackBtn" class="secondary-button" type="button">目录导入兼容模式</button>
              <button id="toggleMindMapModeBtn" class="secondary-button" type="button" disabled>切换到思维导图模式</button>
            </div>
            <input id="rootPathInput" type="hidden" />
            <input id="folderInput" type="file" webkitdirectory directory multiple hidden />
          </div>
        </header>

      <section id="emptyLanding" class="empty-landing">
        <div class="empty-landing-inner">
          <div class="empty-landing-icon">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
              <path d="M12 11v6M9 14h6"/>
            </svg>
          </div>
          <h2>选择一个 Skill 目录开始</h2>
          <p>点击上方「选择目录」按钮，导入 skill 文件夹后即可浏览文件结构、内容预览和引用关系。</p>
        </div>
      </section>

      <main id="workspaceMain" class="workspace" hidden>
        <aside class="sidebar panel">
          <div class="panel-head">
            <div class="panel-heading">
              <h2>文件树</h2>
              <button id="toggleSidebarBtn" class="panel-toggle" type="button" aria-expanded="true">收起</button>
            </div>
            <input id="fileFilterInput" class="filter-input" type="search" placeholder="筛选文件名或路径" />
          </div>
          <div id="fileTree" class="file-tree empty-state">
            选择目录后，这里会列出 skill 目录中的文件结构。
          </div>
        </aside>

        <section class="content panel">
          <div class="panel-head panel-head-content">
            <div>
              <h2 id="contentTitle">内容预览</h2>
              <p id="contentSubtitle" class="panel-subtitle">点击正文中的引用路径即可跳转到对应文件。</p>
            </div>
            <div class="history-actions">
              <button id="backButton" class="ghost-button" type="button" disabled>返回上一步</button>
              <button id="forwardButton" class="ghost-button" type="button" disabled>前进一步</button>
            </div>
          </div>
          <div id="historyTrail" class="history-trail empty-trail">访问链会显示在这里。</div>
          <article id="documentView" class="document-view empty-state">
            打开 skill 后，这里会显示解析后的内容。
          </article>
        </section>

        <aside class="references panel">
          <div class="panel-head">
            <div class="panel-heading">
              <h2>引用导航</h2>
              <button id="toggleReferencesBtn" class="panel-toggle" type="button" aria-expanded="true">收起</button>
            </div>
            <p class="panel-subtitle">列出当前文件中识别到的引用目标。</p>
          </div>
          <div id="referenceList" class="reference-list empty-state">当前没有可展示的引用。</div>
          <div id="matchPanel" class="match-panel hidden"></div>
        </aside>
      </main>
      </section>
    </div>

    <script src="./assets/mind-map.js"></script>
    <script src="./assets/app.js"></script>
  </body>
</html>
