{% extends "base.html" %}
{% block title %}登录 - Skill 评分系统{% endblock %}
{% block content %}
<div class="login-card">
    <h1>Skill 评分系统</h1>
    <p>普通用户：输入你的名字即可进入评分</p>
    <p class="login-admin-hint">管理员：输入 <code>admin</code>，并填写密码</p>
    <form method="post">
        <input type="text" name="username" id="usernameInput"
               placeholder="输入你的名字" required autofocus
               value="{{ request.form.get('username', '') }}">
        <div id="passwordField" class="password-field" style="display:none">
            <input type="password" name="password"
                   placeholder="输入管理员密码" id="passwordInput">
        </div>
        {% if error %}
        <div class="login-error">{{ error }}</div>
        {% endif %}
        <button type="submit" class="btn btn-primary">进入评分</button>
    </form>
</div>
{% endblock %}
{% block scripts %}
<script>
(function() {
    var usernameInput = document.getElementById('usernameInput');
    var passwordField = document.getElementById('passwordField');
    var passwordInput = document.getElementById('passwordInput');

    function togglePassword() {
        if (usernameInput.value.trim().toLowerCase() === 'admin') {
            passwordField.style.display = 'block';
            setTimeout(function() { passwordInput.focus(); }, 50);
        } else {
            passwordField.style.display = 'none';
            passwordInput.value = '';
        }
    }

    usernameInput.addEventListener('input', togglePassword);
    togglePassword();

    {% if show_password %}
    passwordField.style.display = 'block';
    {% endif %}
})();
</script>
{% endblock %}
